<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn English for Switzerland</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        header {
            background-color: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-container {
            flex-shrink: 0;
        }

        .logo-container img {
            height: 80px;
            width: auto;
            border-radius: 8px;
        }

        .header-text h1 {
            color: #172033;
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .header-text p {
            color: #65708a;
            font-size: 1.1em;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: #172033;
            margin-bottom: 20px;
            text-align: center;
        }

        .quiz-section {
            margin-bottom: 30px;
        }

        .vocab-item {
            background-color: #f5f5f5;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            border-radius: 5px;
        }

        .vocab-item .word {
            color: #172033;
            font-weight: bold;
            font-size: 1.1em;
        }

        .vocab-item .meaning {
            color: #65708a;
            font-size: 0.95em;
            margin-top: 5px;
        }

        .vocab-item .unit {
            color: #999;
            font-size: 0.85em;
            margin-top: 5px;
        }

        button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #764ba2;
        }

        .quiz-container {
            margin-top: 20px;
        }

        .question {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .question p {
            color: #172033;
            margin-bottom: 10px;
            font-weight: bold;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }

        .result.correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Learn English Logo">
        </div>
        <div class="header-text">
            <h1>Learn English for Switzerland</h1>
            <p>Master English vocabulary and skills for Swiss education</p>
        </div>
    </header>

    <div class="container">
        <h2>English Vocabulary Quiz</h2>
        <p style="text-align: center; color: #65708a; margin-bottom: 20px;">
            This is to learn English hope you have fun : )
        </p>

        <div class="quiz-section">
            <button onclick="startQuiz()">Start Quiz</button>
            <button onclick="showVocabulary()">Show Vocabulary</button>
        </div>

        <div id="vocabulary-list" class="quiz-section" style="display: none;">
            <h3 style="color: #172033; margin-bottom: 15px;">Vocabulary List</h3>
            <div id="vocab-container"></div>
        </div>

        <div id="quiz-container" class="quiz-container" style="display: none;">
            <div id="quiz-content"></div>
        </div>
    </div>

    <script>
        const vocab = [
            {"word": "diary", "meaning": "Tagebuch", "unit": 1},
            {"word": "hostel", "meaning": "Herberge, (billiges) Hotel", "unit": 1},
            {"word": "kilt", "meaning": "Schottenrock, Kilt", "unit": 1},
            {"word": "landscape", "meaning": "Landschaft", "unit": 1},
            {"word": "port", "meaning": "Hafen", "unit": 1},
            {"word": "postcard", "meaning": "Postkarte", "unit": 1},
            {"word": "souvenir", "meaning": "Andenken, Souvenir", "unit": 1},
            {"word": "tour", "meaning": "Rundgang, Rundfahrt", "unit": 1}
        ];

        function showVocabulary() {
            const vocabList = document.getElementById('vocabulary-list');
            const vocabContainer = document.getElementById('vocab-container');
            const quizContainer = document.getElementById('quiz-container');

            if (vocabList.style.display === 'none') {
                vocabContainer.innerHTML = '';
                vocab.forEach(v => {
                    const item = document.createElement('div');
                    item.className = 'vocab-item';
                    item.innerHTML = `
                        <div class="word">${v.word}</div>
                        <div class="meaning">${v.meaning}</div>
                        <div class="unit">Unit ${v.unit}</div>
                    `;
                    vocabContainer.appendChild(item);
                });
                vocabList.style.display = 'block';
                quizContainer.style.display = 'none';
            } else {
                vocabList.style.display = 'none';
            }
        }

        function startQuiz() {
            const quizContainer = document.getElementById('quiz-container');
            const vocabList = document.getElementById('vocabulary-list');
            const quizContent = document.getElementById('quiz-content');

            vocabList.style.display = 'none';

            quizContent.innerHTML = '';
            const questions = vocab.slice(0, 5);

            questions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.innerHTML = `
                    <p>${index + 1}. What is the meaning of "<strong>${q.word}</strong>"?</p>
                    <input type="text" id="answer-${index}" placeholder="Enter the meaning...">
                    <button onclick="checkAnswer(${index}, '${q.meaning}')">Check Answer</button>
                    <div id="result-${index}"></div>
                `;
                quizContent.appendChild(questionDiv);
            });

            quizContainer.style.display = 'block';
        }

        function checkAnswer(index, correctAnswer) {
            const userAnswer = document.getElementById(`answer-${index}`).value.toLowerCase().trim();
            const resultDiv = document.getElementById(`result-${index}`);
            const correct = correctAnswer.toLowerCase().includes(userAnswer) || userAnswer.includes(correctAnswer.toLowerCase().split(',')[0]);

            if (correct) {
                resultDiv.className = 'result correct';
                resultDiv.textContent = '✓ Correct!';
            } else {
                resultDiv.className = 'result incorrect';
                resultDiv.textContent = `✗ Incorrect. The answer is: ${correctAnswer}`;
            }
        }
    </script>
</body>
</html>
